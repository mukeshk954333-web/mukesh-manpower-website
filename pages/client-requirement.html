<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Manpower Requirement - MUKESH MANPOWER</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#DC0000',
                            blue: '#002D60',
                            darkBg: '#050505',
                            cardDark: '#0D1117',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Teko"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-darkBg text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-black border-b border-brand-blue/60 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2">
                <span class="font-display text-2xl font-bold tracking-wider text-white">MUKESH</span>
                <span class="font-display text-2xl font-bold tracking-wider text-brand-red">MANPOWER</span>
            </a>
            <a href="../index.html" class="text-xs font-bold bg-brand-cardDark hover:bg-brand-blue text-gray-200 px-3.5 py-2 rounded-lg border border-brand-blue transition">
                <i class="fa-solid fa-arrow-left"></i> होमपेज
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 sm:py-10 w-full flex-grow">

        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">
                कॉर्पोरेट मैनपॉवर मांग (Company Requirement)
            </h1>
            <p class="text-xs sm:text-sm text-gray-400 mt-2 max-w-2xl mx-auto">
                पूरे भारत में अपने प्रोजेक्ट के लिए मिस्त्री, हेल्पर या मशीन ऑपरेटर की मांग और अपना प्रस्तावित रेट (Budget) यहाँ दर्ज करें।
            </p>
        </div>

        <!-- Form Card -->
        <div class="bg-brand-cardDark border border-brand-blue rounded-2xl p-6 sm:p-10 shadow-2xl">
            <form id="companyRequirementForm" class="space-y-6">

                <!-- 1. Company Details -->
                <div class="space-y-4">
                    <div class="border-b border-gray-800 pb-2 text-brand-blueLight font-bold text-sm">
                        <i class="fa-solid fa-building"></i> 1. कंपनी एवं संपर्क विवरण
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कंपनी / ठेकेदार का नाम *</label>
                            <input type="text" id="companyName" required placeholder="कंपनी का नाम" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">संपर्क व्यक्ति का नाम *</label>
                            <input type="text" id="contactPerson" required placeholder="आपका नाम" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">मोबाइल नंबर (WhatsApp) *</label>
                            <input type="tel" id="mobileNumber" required maxlength="10" placeholder="10 अंकों का मोबाइल नंबर" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कार्यस्थल का राज्य *</label>
                            <select id="stateSelect" required class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                                <option value="">-- राज्य चुनें --</option>
                                <option value="Delhi">दिल्ली (NCR)</option>
                                <option value="Maharashtra">महाराष्ट्र</option>
                                <option value="Karnataka">कर्नाटक</option>
                                <option value="Gujarat">गुजरात</option>
                                <option value="Uttar Pradesh">उत्तर प्रदेश</option>
                                <option value="Bihar">बिहार</option>
                                <option value="Jharkhand">झारखंड</option>
                                <option value="Punjab">पंजाब</option>
                                <option value="Haryana">हरियाणा</option>
                                <option value="Rajasthan">राजस्थान</option>
                                <option value="West Bengal">पश्चिम बंगाल</option>
                                <option value="Madhya Pradesh">मध्य प्रदेश</option>
                                <option value="Odisha">ओडिशा</option>
                                <option value="Chhattisgarh">छत्तीसगढ़</option>
                                <option value="Tamil Nadu">तमिलनाडु</option>
                                <option value="Other">अन्य राज्य</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 2. Manpower Requirement & Rates -->
                <div class="space-y-4">
                    <div class="border-b border-gray-800 pb-2 text-brand-blueLight font-bold text-sm">
                        <i class="fa-solid fa-users"></i> 2. कामगारों की आवश्यकता एवं कंपनी का रेट
                    </div>

                    <!-- Mistry -->
                    <div class="p-4 bg-black rounded-lg border border-gray-800 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">मिस्त्री (Skilled) की संख्या</label>
                            <input type="number" id="mistryCount" min="0" placeholder="कितने मिस्त्री चाहिए?" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कंपनी द्वारा प्रस्तावित रेट (₹/दिन)</label>
                            <input type="number" id="mistryRate" min="0" placeholder="आप क्या रेट देंगे?" class="w-full bg-brand-darkBg border border-gray-700 text-yellow-400 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                    </div>

                    <!-- Helper -->
                    <div class="p-4 bg-black rounded-lg border border-gray-800 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">हेल्पर (Unskilled) की संख्या</label>
                            <input type="number" id="helperCount" min="0" placeholder="कितने हेल्पर चाहिए?" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कंपनी द्वारा प्रस्तावित रेट (₹/दिन)</label>
                            <input type="number" id="helperRate" min="0" placeholder="आप क्या रेट देंगे?" class="w-full bg-brand-darkBg border border-gray-700 text-yellow-400 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                    </div>

                    <!-- Machine Operator -->
                    <div class="p-4 bg-black rounded-lg border border-gray-800 space-y-3">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कौन सी मशीन का ऑपरेटर चाहिए?</label>
                            <input type="text" id="machineName" placeholder="उदा. JCB, Crane, Poclain..." class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">ऑपरेटर की संख्या</label>
                                <input type="number" id="operatorCount" min="0" placeholder="कितने ऑपरेटर चाहिए?" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">ऑपरेटर का प्रस्तावित रेट (₹/दिन)</label>
                                <input type="number" id="operatorRate" min="0" placeholder="आप क्या रेट देंगे?" class="w-full bg-brand-darkBg border border-gray-700 text-yellow-400 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- Machine Helper -->
                    <div class="p-4 bg-black rounded-lg border border-gray-800 space-y-3">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">कौन सी मशीन का हेल्पर चाहिए?</label>
                            <input type="text" id="machineHelperName" placeholder="उदा. JCB Helper, Drill Helper..." class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">मशीन हेल्पर की संख्या</label>
                                <input type="number" id="machineHelperCount" min="0" placeholder="कितने मशीन हेल्पर चाहिए?" class="w-full bg-brand-darkBg border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">मशीन हेल्पर का प्रस्तावित रेट (₹/दिन)</label>
                                <input type="number" id="machineHelperRate" min="0" placeholder="आप क्या रेट देंगे?" class="w-full bg-brand-darkBg border border-gray-700 text-yellow-400 rounded-lg px-3 py-2 text-sm focus:border-brand-red outline-none">
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 rounded-xl text-sm sm:text-base transition shadow-2xl flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>WhatsApp पर अपनी मांग (Requirement) भेजें</span>
                    </button>
                </div>

            </form>
        </div>

    </main>

    <script>
        document.getElementById('companyRequirementForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. Get Company Details
            const companyName = document.getElementById('companyName').value.trim();
            const contactPerson = document.getElementById('contactPerson').value.trim();
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const stateSelect = document.getElementById('stateSelect').value;

            // Validation check for mobile
            if(!/^[6-9]\d{9}$/.test(mobileNumber)) {
                alert("कृपया सही 10-अंकीय मोबाइल नंबर दर्ज करें।");
                return;
            }

            // 2. Get Requirements & Rates
            const mistryCount = document.getElementById('mistryCount').value || "0";
            const mistryRate = document.getElementById('mistryRate').value || "NA";
            
            const helperCount = document.getElementById('helperCount').value || "0";
            const helperRate = document.getElementById('helperRate').value || "NA";

            const machineName = document.getElementById('machineName').value || "कोई नहीं";
            const operatorCount = document.getElementById('operatorCount').value || "0";
            const operatorRate = document.getElementById('operatorRate').value || "NA";

            const machineHelperName = document.getElementById('machineHelperName').value || "कोई नहीं";
            const machineHelperCount = document.getElementById('machineHelperCount').value || "0";
            const machineHelperRate = document.getElementById('machineHelperRate').value || "NA";

            // 3. Format Message for WhatsApp
            const message = `🏢 *COMPANY MANPOWER REQUIREMENT*\n\n` +
                `*Company:* ${companyName}\n` +
                `*Contact Person:* ${contactPerson}\n` +
                `*Mobile:* ${mobileNumber}\n` +
                `*Work State:* ${stateSelect}\n\n` +
                `------------------------\n` +
                `*REQUIREMENT & PROPOSED RATES*\n` +
                `------------------------\n` +
                `*1. Mistry (Skilled):*\n` +
                `   - Quantity: ${mistryCount}\n` +
                `   - Proposed Rate: ₹${mistryRate}/day\n\n` +
                `*2. Normal Helper:*\n` +
                `   - Quantity: ${helperCount}\n` +
                `   - Proposed Rate: ₹${helperRate}/day\n\n` +
                `*3. Machine Operator:*\n` +
                `   - Machine: ${machineName}\n` +
                `   - Quantity: ${operatorCount}\n` +
                `   - Proposed Rate: ₹${operatorRate}/day\n\n` +
                `*4. Machine Helper:*\n` +
                `   - Machine: ${machineHelperName}\n` +
                `   - Quantity: ${machineHelperCount}\n` +
                `   - Proposed Rate: ₹${machineHelperRate}/day\n\n` +
                `_Sent via Mukesh Manpower Website_`;

            // 4. Encode and Send
            const whatsappNumber = "916379403821"; 
            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
            
            window.open(whatsappURL, '_blank');
        });
    </script>
</body>
</html>
